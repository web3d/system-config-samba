<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root may own the well-known name (the backend runs as root). -->
  <policy user="root">
    <allow own="org.fedoraproject.Config.Samba"/>
    <allow send_destination="org.fedoraproject.Config.Samba"/>
  </policy>

  <!-- Any user on the system bus may call the backend; actual authorisation
       is enforced by the org.fedoraproject.config.samba.configure polkit action inside
       the service, not here. -->
  <policy context="default">
    <allow send_destination="org.fedoraproject.Config.Samba"/>
    <allow receive_sender="org.fedoraproject.Config.Samba"/>
  </policy>

</busconfig>
